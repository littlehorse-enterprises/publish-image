name: Build and publish docker images
description: Builds and publish docker images to github registry
inputs:
  image-name:
    description: Image name for example lh-server
    required: true
  context:
    description: Docker build context path
    default: .
  dockerfile:
    description: Relative route of Dockerfile
    required: true
  registry:
    description: Container registry github, ecr or quay, it now accepts comma separated values to support multiple registries, for example "github,ecr"
    default: github
  github-token:
    description: Github secret secrets.GITHUB_TOKEN required only if registry is github
    default: ""
  platforms:
    description: Architecture platforms
    default: "linux/amd64,linux/arm64"
  prefix:
    description: prefix to be appended to image tag ex brach-
    default: ""
  tags:
    description: "tags strategy configuration. For more information see: https://github.com/docker/metadata-action?tab=readme-ov-file#tags-input"
    default: ""
  build-args:
    description: "List of build-time variables"
    required: false
  quay-username:
    description: "Quay username"
    default: "littlehorse+github"
  quay-token:
    description: "Quay token"
    default: ""
  ghcr-root:
    description: "Either if use repo root or image name for images hosted in ghcr.io"
    default: "false"
  push:
    description: "Whether to push the built image to the registry"
    default: "true"
outputs:
  tags:
    description: Tags for the built image
    value: ${{ steps.meta.outputs.tags }}
runs:
  using: composite
  steps:
    - name: Registry not recognized
      shell: bash
      run: |
        IFS=',' read -ra REGISTRIES <<< "${{ inputs.registry }}"
        for reg in "${REGISTRIES[@]}"; do
          if [[ "$reg" != "github" && "$reg" != "ecr" && "$reg" != "quay" ]]; then
            echo "Registry '$reg' not recognized, it should be github, ecr or quay"
            exit 1
          fi
        done

    - name: github-token is required
      shell: bash
      if: ${{ contains(inputs.registry, 'github') && inputs.github-token == '' }}
      run: |
        echo "github-token is required when registry is github"
        exit 1

    - name: quay-token is required
      shell: bash
      if: ${{ contains(inputs.registry, 'quay') && inputs.quay-token == '' }}
      run: |
        echo "quay-token is required when registry is quay"
        exit 1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to github registry
      if: ${{ contains(inputs.registry, 'github') }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Configure AWS credentials
      if: ${{ contains(inputs.registry, 'ecr') }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::637423582379:role/GithubActions-ECR
        role-session-name: gha-ecr
        aws-region: us-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      if: ${{ contains(inputs.registry, 'ecr') }}
      uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Quay.io
      uses: docker/login-action@v4
      if: ${{ contains(inputs.registry, 'quay') }}
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-token }}

    - name: Set DOCKER_IMAGE for github
      if: ${{ contains(inputs.registry, 'github') }}
      shell: bash
      run: |
        if [ "${{ inputs.ghcr-root }}" = "true" ]; then
          echo "DOCKER_IMAGE_GITHUB=ghcr.io/littlehorse-enterprises/${{ inputs.image-name }}" >> $GITHUB_ENV
        else
          echo "DOCKER_IMAGE_GITHUB=ghcr.io/${{ github.repository }}/${{ inputs.image-name }}" >> $GITHUB_ENV
        fi

    - name: Set DOCKER_IMAGE for ecr
      if: ${{ contains(inputs.registry, 'ecr') }}
      shell: bash
      run: |
        echo "DOCKER_IMAGE_ECR=${{ steps.login-ecr.outputs.registry }}/${{ inputs.image-name }}" >> $GITHUB_ENV

    - name: Set DOCKER_IMAGE for quay
      if: ${{ contains(inputs.registry, 'quay') }}
      shell: bash
      run: |
        echo "DOCKER_IMAGE_QUAY=quay.io/littlehorse/${{ inputs.image-name }}" >> $GITHUB_ENV

    - name: Extract metadata (tags, labels) for Docker
      uses: docker/metadata-action@v6
      id: meta
      with:
        images: |
          ${{ env.DOCKER_IMAGE_GITHUB }}
          ${{ env.DOCKER_IMAGE_ECR }}
          ${{ env.DOCKER_IMAGE_QUAY }}
        flavor: |
          prefix=${{ inputs.prefix }}
        tags: ${{ inputs.tags }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}

    - name: Write published image summary
      shell: bash
      run: |
        {
          echo "## Published Docker Image Tags"
          echo
          echo "The following tags were pushed:"
          echo
          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "- \`$tag\`"
          done <<< "${{ steps.meta.outputs.tags }}"
        } >> "$GITHUB_STEP_SUMMARY"
